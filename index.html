<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abhinav OS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="boot-screen" class="boot-screen" aria-live="polite" aria-hidden="false">
      <div class="terminal terminal--boot">
        <div class="terminal__bar">
          <span class="dot dot--red"></span>
          <span class="dot dot--yellow"></span>
          <span class="dot dot--green"></span>
        </div>

        <div class="terminal__body terminal__body--boot">
          <div id="boot-output" class="boot-screen__output" aria-label="Boot sequence"></div>

          <div class="boot-screen__progress" aria-label="Boot progress">
            <div class="boot-screen__progress-track">
              <div id="boot-progress-fill" class="boot-screen__progress-fill"></div>
            </div>
            <p id="boot-progress-label" class="boot-screen__progress-label">Loading 0%</p>
          </div>
        </div>
      </div>
    </div>

    <main class="hero" aria-hidden="true">
      <section class="terminal" aria-label="Portfolio hero section">
        <div class="terminal__bar">
          <span class="dot dot--red"></span>
          <span class="dot dot--yellow"></span>
          <span class="dot dot--green"></span>
        </div>

        <div class="terminal__body terminal__body--hero">
          <div class="hero__main">
            <div class="hero__header">
              <p class="line hero__prompt-line">
                <span class="prompt">C:\Users\Visitor&gt;</span>
                <span id="hero-command" class="hero__command"></span>
                <span id="hero-cursor" class="hero__cursor" aria-hidden="true"></span>
              </p>

              <div id="hero-output" class="hero__output" aria-live="polite"></div>
              <div id="hero-commands" class="hero__commands" hidden></div>
              <p id="hero-continuation" class="line hero__continuation" hidden></p>
            </div>
          </div>

          <aside class="hero__status" aria-label="System status">
            <p class="hero__status-title">SYSTEM STATUS</p>
            <div class="hero__status-row hero__status-row--online">
              <span class="hero__status-dot"></span>
              <span>ONLINE</span>
            </div>
            <p class="hero__status-item"><span>Location</span>India</p>
            <p class="hero__status-item"><span>Mode</span>Building</p>
            <p class="hero__status-item"><span>Coffee</span>Unknown</p>
            <p class="hero__status-item"><span>Bug Count</span>???</p>
            <div class="hero__status-clock">
              <span class="hero__status-label">Local Time</span>
              <span id="hero-clock" class="hero__clock">--:--:--</span>
            </div>
          </aside>
        </div>
      </section>
    </main>

    <section class="whoami" id="whoami" aria-label="Who am I terminal section">
      <div class="terminal terminal--whoami">
        <div class="terminal__bar">
          <span class="dot dot--red"></span>
          <span class="dot dot--yellow"></span>
          <span class="dot dot--green"></span>
        </div>

        <div class="terminal__body terminal__body--whoami">
          <p class="line whoami__prompt-line">
            <span class="prompt">C:\Users\Visitor&gt;</span>
            <span id="whoami-command" class="whoami__command"></span>
            <span id="whoami-cursor" class="whoami__cursor" aria-hidden="true"></span>
          </p>

          <div id="whoami-output" class="whoami__output" aria-live="polite"></div>
        </div>
      </div>
    </section>

    <div class="hero__anchors" aria-hidden="true">
      <span id="history"></span>
      <span id="projects"></span>
      <span id="passions"></span>
      <span id="future"></span>
    </div>

    <script src="script.js"></script>
  </body>
</html>
